<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dubl Block - Drop. Match. Double. An iOS puzzle game.">
    <meta name="theme-color" content="#0D0D0D">
    <title>Dubl Block — Drop. Match. Double.</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #0D0D0D;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: #5AC8FA;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 48px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        a {
            color: #5AC8FA;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 12px 32px;
            border: 1px solid #5AC8FA33;
            border-radius: 12px;
            transition: all 0.2s;
            min-width: 240px;
            text-align: center;
        }
        a:hover { background: #5AC8FA15; border-color: #5AC8FA66; }
        .contact {
            margin-top: 48px;
            color: #666;
            font-size: 0.9rem;
            text-align: center;
        }
        .contact a { border: none; padding: 0; min-width: 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>DUBL BLOCK</h1>
    <p class="tagline">Drop. Match. Double.</p>
    <div class="links">
        <a href="privacy/">Privacy Policy</a>
        <a href="terms/">Terms of Use</a>
    </div>
    <div class="contact">
        <p>Contact: <a href="mailto:info@dublblockgame.com">info@dublblockgame.com</a></p>
        <p style="margin-top: 8px;">&copy; 2026 Sergej Birklin. All rights reserved.</p>
    </div>
</body>
</html>
